# Creado por Aldo Garcia.
# ---------------------------------------------------------------------------
# Despliegue contenerizado de Matrix RH.
#
# Ollama NO se contenteneriza: los modelos ocupan decenas de GB y suelen
# necesitar la GPU del host. El backend lo alcanza por host.docker.internal, y la
# URL es configurable para que el mismo compose sirva en Linux (donde se usa la
# IP del gateway) sin tocar el archivo.
#
# Sólo Nginx se expone. MySQL, Qdrant y el backend viven en la red interna.
# ---------------------------------------------------------------------------

name: matrix-rh

services:
  mysql:
    image: mysql:8.4
    container_name: matrixrh-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: matrix_rh
      MYSQL_USER: matrixrh
      # Los valores reales llegan del entorno del host o del gestor de secretos.
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD en el entorno}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD en el entorno}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    networks: [matrixrh]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: matrixrh-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?defina QDRANT_API_KEY en el entorno}
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [matrixrh]
    healthcheck:
      # La imagen incluye bash. El socket confirma que Qdrant acepta conexiones;
      # `exit 0` ocultaba contenedores caidos o todavia no iniciados.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: matrixrh-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-staging}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_SECRET_KEY: ${APP_SECRET_KEY:?defina APP_SECRET_KEY en el entorno}
      DATABASE_URL: mysql+pymysql://matrixrh:${MYSQL_PASSWORD}@mysql:3306/matrix_rh?charset=utf8mb4
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      # Ollama corre en el host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local_test}
      LOCAL_TEST_AUTH_ENABLED: ${LOCAL_TEST_AUTH_ENABLED:-false}
      LOCAL_TEST_SEED_USERS_ENABLED: ${LOCAL_TEST_SEED_USERS_ENABLED:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    volumes:
      # El conocimiento se monta de sólo lectura: el contenedor lo indexa, no lo edita.
      - ./data/knowledge:/app/data/knowledge:ro
      - backend_var:/app/var
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [matrixrh]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/health', timeout=5).status_code==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: matrixrh-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    # Único servicio expuesto.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/matrixrh.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    networks: [matrixrh]

networks:
  matrixrh:
    driver: bridge

volumes:
  mysql_data:
  qdrant_data:
  backend_var:
